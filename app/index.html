<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover — Multi-Panel GTA 6 Style Cover Maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover editor">
    <h1>Vice Cover</h1>
    <p class="lede">Two photos, a caption and a grade — a multi-panel GTA-style cover, exported as a PNG.</p>

    <fieldset>
      <legend>First photo</legend>
      <div class="pickers">
        <button type="button" data-slot="photo" data-photo="pier">Pier</button>
        <button type="button" data-slot="photo" data-photo="boulevard">Boulevard</button>
        <label class="upload">Upload… <input id="photo-file" type="file" accept="image/*"></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Second photo</legend>
      <div class="pickers">
        <button type="button" data-slot="photo2" data-photo="pier">Pier</button>
        <button type="button" data-slot="photo2" data-photo="boulevard">Boulevard</button>
        <label class="upload">Upload… <input id="photo2-file" type="file" accept="image/*"></label>
      </div>
      <label class="mix"><input id="mix" type="checkbox"> Use the first photo in every panel</label>
    </fieldset>

    <label class="field">Caption
      <input id="caption" type="text" maxlength="40" value="VICE CITY NIGHTS">
    </label>
    <label class="field">Tagline
      <input id="tagline" type="text" maxlength="60" value="Two shores. One score.">
    </label>

    <fieldset>
      <legend>Panels</legend>
      <div class="radios">
        <label><input type="radio" name="layout" value="trio" checked> Trio · 1 big + 2 small</label>
        <label><input type="radio" name="layout" value="quad"> Quad · 2 × 2</label>
        <label><input type="radio" name="layout" value="duo"> Duo · side by side</label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Colour grade</legend>
      <div class="radios">
        <label><input type="radio" name="grade" value="sunset" checked> Sunset</label>
        <label><input type="radio" name="grade" value="neon"> Neon</label>
        <label><input type="radio" name="grade" value="teal"> Teal</label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Size</legend>
      <div class="radios">
        <label><input type="radio" name="size" value="square" checked> Square 1080 × 1080</label>
        <label><input type="radio" name="size" value="portrait"> Portrait 1024 × 1280</label>
        <label><input type="radio" name="size" value="wide"> Wide 1280 × 720</label>
      </div>
    </fieldset>

    <button id="export" type="button">Export PNG Square 1080 x 1080</button>
    <p id="status" role="status"></p>
  </section>
  <canvas id="cover" width="1080" height="1080" aria-label="The cover preview"></canvas>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
