<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover — GTA 6 Style Cover Art Maker</title>
<link rel="stylesheet" href="style.css">
<link rel="preload" href="fonts/Anton-Regular.ttf" as="font" type="font/ttf" crossorigin>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-mark">VC</span><span class="brand-name">VICE COVER</span></div>
  <p class="brand-sub">Multi-panel GTA 6 style cover art maker</p>
</header>
<main class="layout">
  <section class="preview-pane" aria-label="Cover preview">
    <canvas id="cover" width="1080" height="1080"></canvas>
    <p class="preview-hint" id="preview-hint">Live preview — every change redraws instantly.</p>
  </section>
  <aside class="panel" aria-label="Cover controls">
    <h2>Make your cover</h2>
    <div class="field">
      <label for="photo1">Photo 1</label>
      <div class="photo-row">
        <img id="thumb1" src="samples/boulevard.jpg" alt="Photo 1 preview">
        <div class="photo-actions">
          <button type="button" class="btn ghost" id="use-sample1">Use boulevard sample</button>
          <label class="btn ghost upload-label">Upload<input type="file" id="photo1" accept="image/*" hidden></label>
        </div>
      </div>
    </div>
    <div class="field">
      <label for="photo2">Photo 2</label>
      <div class="photo-row">
        <img id="thumb2" src="samples/pier.jpg" alt="Photo 2 preview">
        <div class="photo-actions">
          <button type="button" class="btn ghost" id="use-sample2">Use pier sample</button>
          <label class="btn ghost upload-label">Upload<input type="file" id="photo2" accept="image/*" hidden></label>
        </div>
      </div>
    </div>
    <div class="field">
      <label for="caption">Title</label>
      <input type="text" id="caption" maxlength="24" value="VICE CITY" autocomplete="off">
    </div>
    <div class="field">
      <label for="tagline">Tagline</label>
      <input type="text" id="tagline" maxlength="48" value="WELCOME BACK" autocomplete="off">
    </div>
    <div class="field">
      <label>Layout</label>
      <div class="seg" id="layout-seg" role="group" aria-label="Panel layout">
        <button type="button" data-value="trio" class="active">Trio</button>
        <button type="button" data-value="quad">Quad</button>
        <button type="button" data-value="duo">Duo</button>
      </div>
    </div>
    <div class="field">
      <label>Colour grade</label>
      <div class="seg" id="grade-seg" role="group" aria-label="Colour grade">
        <button type="button" data-value="sunset" class="active">Sunset</button>
        <button type="button" data-value="neon">Neon</button>
        <button type="button" data-value="teal">Teal</button>
      </div>
    </div>
    <div class="field">
      <label>Size</label>
      <div class="seg" id="size-seg" role="group" aria-label="Cover size">
        <button type="button" data-value="square" class="active">Square 1080×1080</button>
        <button type="button" data-value="portrait">Portrait 1024×1280</button>
        <button type="button" data-value="wide">Wide 1280×720</button>
      </div>
    </div>
    <div class="field">
      <label for="mix">Grade strength <span id="mix-value">55%</span></label>
      <input type="range" id="mix" min="0" max="100" value="55">
    </div>
    <div class="actions">
      <button type="button" class="btn primary" id="export">Export PNG</button>
      <button type="button" class="btn ghost" id="copy-link">Copy share link</button>
      <button type="button" class="btn ghost" id="shuffle">Shuffle look</button>
    </div>
    <p class="fineprint">Anton typeface — SIL Open Font License 1.1, see fonts/OFL.txt. Photos stay on your device; nothing is uploaded.</p>
  </aside>
</main>
<script src="src/state.js"></script>
<script src="src/cover.js"></script>
<script src="src/main.js"></script>
<script src="src/shots.js"></script>
</body>
</html>
